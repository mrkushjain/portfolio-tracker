<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Tracker</title>
  <link rel="icon" type="image/png" sizes="512x512" href="icon.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="icon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    [x-cloak] { display: none; }
    .tab-active  { background: #4f46e5; color: #fff; }
    .tab-inactive{ background: transparent; color: #6b7280; }
    .tab-inactive:hover { background: #f3f4f6; color: #374151; }
    .modal-bg { background: rgba(0,0,0,.5); }
    .badge-buy    { background:#dcfce7; color:#15803d; }
    .badge-sell   { background:#fee2e2; color:#dc2626; }
    .badge-pending   { background:#fef3c7; color:#b45309; }
    .badge-fulfilled { background:#dcfce7; color:#15803d; }
    .badge-cancelled { background:#f3f4f6; color:#6b7280; }
    input, select, textarea {
      border: 1px solid #d1d5db;
      border-radius: 0.375rem;
      padding: 0.375rem 0.625rem;
      font-size: 0.875rem;
      width: 100%;
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: #4f46e5; box-shadow: 0 0 0 2px rgba(79,70,229,.2); }
    .card { background: #fff; border-radius: 0.5rem; box-shadow: 0 1px 3px rgba(0,0,0,.1); padding: 1.25rem; }
    .btn-primary   { background:#4f46e5; color:#fff; border-radius:.375rem; padding:.375rem .875rem; font-size:.875rem; font-weight:500; cursor:pointer; }
    .btn-primary:hover { background:#4338ca; }
    .btn-danger    { background:#dc2626; color:#fff; border-radius:.375rem; padding:.25rem .625rem; font-size:.75rem; cursor:pointer; }
    .btn-danger:hover  { background:#b91c1c; }
    .btn-success   { background:#16a34a; color:#fff; border-radius:.375rem; padding:.25rem .625rem; font-size:.75rem; cursor:pointer; }
    .btn-success:hover { background:#15803d; }
    .btn-gray      { background:#f3f4f6; color:#374151; border-radius:.375rem; padding:.25rem .625rem; font-size:.75rem; cursor:pointer; border:1px solid #d1d5db; }
    .btn-gray:hover    { background:#e5e7eb; }
    .btn-indigo    { background:#4f46e5; color:#fff; border-radius:.375rem; padding:.25rem .625rem; font-size:.75rem; cursor:pointer; }
    .btn-indigo:hover  { background:#4338ca; }
    th { background:#f9fafb; font-weight:600; font-size:.75rem; text-transform:uppercase; letter-spacing:.05em; color:#6b7280; padding:.5rem .75rem; text-align:left; }
    td { padding:.5rem .75rem; font-size:.875rem; color:#374151; border-top:1px solid #f3f4f6; }
    tr:hover td { background:#fafafa; }
    .form-label { font-size:.75rem; font-weight:600; color:#374151; margin-bottom:.25rem; display:block; }
    .pos-green { color:#16a34a; } .neg-red { color:#dc2626; }
    #toast { transition: all .3s; }
    .progress-bar { height:8px; border-radius:4px; background:#e5e7eb; overflow:hidden; }
    .progress-fill { height:100%; border-radius:4px; background:#4f46e5; transition:width .5s; }
    .spinner { display:inline-block; width:1rem; height:1rem; border:2px solid #e5e7eb; border-top-color:#4f46e5; border-radius:50%; animation:spin .6s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
  <script>
    tailwind.config = { theme: { extend: {} } };
  </script>
</head>
<body class="bg-gray-50 min-h-screen" style="font-family: system-ui, -apple-system, sans-serif;">

<!-- ══════════════════════════ TOAST ══════════════════════════ -->
<div id="toast" class="fixed top-4 right-4 z-50 hidden max-w-sm rounded-lg shadow-lg px-4 py-3 text-sm font-medium"></div>

<!-- ══════════════════════════ HEADER ══════════════════════════ -->
<header class="bg-white border-b border-gray-200 sticky top-0 z-40 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 flex items-center justify-between h-14">
    <div class="flex items-center gap-2">
      <img src="icon.png" alt="Portfolio Tracker" style="width:32px;height:32px;object-fit:contain;" />
      <span class="text-lg font-bold text-indigo-700">Portfolio Tracker</span>
    </div>
    <nav class="flex gap-1">
      <button onclick="switchTab('dashboard')"  id="tb-dashboard"  class="tab-inactive px-3 py-1.5 rounded-md text-sm font-medium transition-colors">Dashboard</button>
      <button onclick="switchTab('piggybanks')" id="tb-piggybanks" class="tab-inactive px-3 py-1.5 rounded-md text-sm font-medium transition-colors">🐷 Piggy Banks</button>
      <button onclick="switchTab('setup')"      id="tb-setup"      class="tab-inactive px-3 py-1.5 rounded-md text-sm font-medium transition-colors">⚙️ Setup</button>
      <button onclick="switchTab('orders')"     id="tb-orders"     class="tab-inactive px-3 py-1.5 rounded-md text-sm font-medium transition-colors">📋 Orders</button>
      <button onclick="switchTab('watchlist')"  id="tb-watchlist"  class="tab-inactive px-3 py-1.5 rounded-md text-sm font-medium transition-colors">👁️ Watchlist</button>
    </nav>
    <div class="flex items-center gap-2">
      <button onclick="loadAll(true)" class="btn-gray flex items-center gap-1.5 text-sm">
        <span id="refresh-icon">↺</span> Refresh
      </button>
      <button onclick="openGasUrlModal()" title="Configure GAS URL" class="btn-gray text-sm px-2.5" id="gas-status-btn">⚙</button>
    </div>
  </div>
</header>

<!-- ══════════════════════════ UNCONFIGURED BANNER ══════════════════════════ -->
<div id="config-banner" class="hidden bg-amber-50 border-b border-amber-200 px-4 py-3 text-sm text-amber-800 text-center cursor-pointer hover:bg-amber-100" onclick="openGasUrlModal()">
  ⚠️ <strong>Google Apps Script URL not set.</strong> Click here (or the ⚙ button) to enter your Web App URL — no file editing required.
</div>

<!-- ══════════════════════════ MAIN CONTENT ══════════════════════════ -->
<main class="max-w-7xl mx-auto px-4 py-6">

  <!-- LOADING -->
  <div id="loading-overlay" class="hidden text-center py-20">
    <div class="spinner" style="width:2rem;height:2rem;border-width:3px;"></div>
    <p class="mt-3 text-gray-500 text-sm">Loading portfolio data…</p>
  </div>

  <!-- DASHBOARD -->
  <div id="panel-dashboard" class="tab-panel"></div>

  <!-- PIGGY BANKS -->
  <div id="panel-piggybanks" class="tab-panel hidden"></div>

  <!-- SETUP -->
  <div id="panel-setup" class="tab-panel hidden"></div>

  <!-- ORDERS -->
  <div id="panel-orders" class="tab-panel hidden"></div>

  <!-- WATCHLIST -->
  <div id="panel-watchlist" class="tab-panel hidden"></div>

</main>

<!-- ══════════════════════════ MODAL OVERLAY ══════════════════════════ -->
<div id="modal-overlay" class="modal-bg fixed inset-0 z-50 flex items-center justify-center hidden">
  <div id="modal-box" class="bg-white rounded-xl shadow-2xl w-full max-w-lg mx-4 max-h-screen overflow-y-auto"></div>
</div>

<!-- ══════════════════════════ JAVASCRIPT ══════════════════════════ -->
<script>
// ─────────────────────────────────────────────────────────────────────────────
//  CONFIGURATION — loaded from localStorage; set via the ⚙ modal at runtime
// ─────────────────────────────────────────────────────────────────────────────
const GAS_URL_KEY = 'portfolio_tracker_gas_url';
let GAS_URL = localStorage.getItem(GAS_URL_KEY) || '';

function gasUrlConfigured() {
  return GAS_URL && !GAS_URL.includes('YOUR_SCRIPT_ID') && GAS_URL.startsWith('https://');
}

function openGasUrlModal() {
  openModal(`
    <div class="p-5">
      ${modalHeader('⚙️ Configure Google Apps Script URL')}
      <p class="text-sm text-gray-600 mb-4">
        Paste the <strong>Web App URL</strong> from your Apps Script deployment.<br/>
        It looks like: <code class="text-xs bg-gray-100 px-1 py-0.5 rounded">https://script.google.com/macros/s/…/exec</code>
      </p>
      <label class="form-label">Web App URL</label>
      <input id="m-gas-url" type="url" placeholder="https://script.google.com/macros/s/…/exec"
        value="${escHtml(GAS_URL)}" />
      <p class="text-xs text-gray-400 mt-2">Saved to your browser's localStorage — never leaves your device.</p>
      <div class="flex justify-between items-center mt-5 pt-4 border-t border-gray-100">
        <button onclick="clearGasUrl()" class="btn-danger text-xs">Clear saved URL</button>
        <div class="flex gap-2">
          <button onclick="closeModal()" class="btn-gray">Cancel</button>
          <button onclick="saveGasUrl()" class="btn-primary">Save & Connect</button>
        </div>
      </div>
    </div>`);
  setTimeout(() => document.getElementById('m-gas-url')?.select(), 60);
}

function saveGasUrl() {
  const val = document.getElementById('m-gas-url').value.trim();
  if (!val.startsWith('https://script.google.com/macros/s/')) {
    toast('URL must start with https://script.google.com/macros/s/', 'error');
    return;
  }
  GAS_URL = val;
  localStorage.setItem(GAS_URL_KEY, val);
  closeModal();
  updateGasStatusIndicator();
  document.getElementById('config-banner').classList.add('hidden');
  toast('URL saved — loading data…');
  loadAll();
}

function clearGasUrl() {
  if (!confirm('Clear the saved URL? The app will stop working until a new URL is entered.')) return;
  GAS_URL = '';
  localStorage.removeItem(GAS_URL_KEY);
  closeModal();
  updateGasStatusIndicator();
  document.getElementById('config-banner').classList.remove('hidden');
  toast('URL cleared', 'error');
}

function updateGasStatusIndicator() {
  const btn = document.getElementById('gas-status-btn');
  if (!btn) return;
  if (gasUrlConfigured()) {
    btn.title = 'Connected — click to change URL';
    btn.style.color = '#16a34a';
  } else {
    btn.title = 'GAS URL not set — click to configure';
    btn.style.color = '#dc2626';
  }
}

// ─────────────────────────────────────────────────────────────────────────────
//  STATE
// ─────────────────────────────────────────────────────────────────────────────
const state = {
  accounts:   [],
  brokers:    [],
  cash:       [],
  holdings:   [],
  piggyBanks: [],
  goalAllocs: [],
  orders:     [],
  watchlist:  [],
  prices:     {},
  currentTab: 'dashboard',
};

let dashboardChart = null;
let pnlChart       = null;
let _orderFilters  = { account: '', broker: '', status: '', type: '' };

// ─────────────────────────────────────────────────────────────────────────────
//  UTILITIES
// ─────────────────────────────────────────────────────────────────────────────
function fmt(amount, currency) {
  if (amount == null || isNaN(amount)) return '—';
  const n = parseFloat(amount);
  if (currency === 'INR') return '₹' + n.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtN(n, digits = 2) { return parseFloat(n || 0).toLocaleString('en-US', { minimumFractionDigits: digits, maximumFractionDigits: digits }); }
function fmtPct(n)   { return (n == null ? '—' : (n > 0 ? '+' : '') + parseFloat(n).toFixed(2) + '%'); }
function pnlClass(n) { return parseFloat(n) >= 0 ? 'pos-green' : 'neg-red'; }
function escHtml(s)  { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function toast(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.className = `fixed top-4 right-4 z-50 max-w-sm rounded-lg shadow-lg px-4 py-3 text-sm font-medium ${
    type === 'success' ? 'bg-green-600 text-white' : 'bg-red-600 text-white'
  }`;
  el.textContent = msg;
  el.classList.remove('hidden');
  setTimeout(() => el.classList.add('hidden'), 3500);
}

function getBroker(id)   { return state.brokers.find(b => b.id === id); }
function getAccount(id)  { return state.accounts.find(a => a.id === id); }
function getCash(bid)    { const c = state.cash.find(c => c.broker_id === bid); return c ? parseFloat(c.balance) : 0; }
function getHoldings(bid){ return state.holdings.filter(h => h.broker_id === bid); }
function getPB(id)       { return state.piggyBanks.find(p => p.id === id); }
function getPBAllocs(pbId){ return state.goalAllocs.filter(a => a.piggy_bank_id === pbId); }
function brokerCurrency(bid){ const b = getBroker(bid); return b ? b.currency : 'USD'; }

function holdingPrice(sym) {
  const p = state.prices[sym];
  return p ? p.price : null;
}
function holdingValue(h) {
  const p = holdingPrice(h.symbol);
  return p != null ? p * parseFloat(h.quantity) : parseFloat(h.quantity) * parseFloat(h.avg_cost);
}

function totalPortfolioValue() {
  let usd = 0, inr = 0;
  state.holdings.forEach(h => {
    const v = holdingValue(h);
    if (brokerCurrency(h.broker_id) === 'INR') inr += v; else usd += v;
  });
  state.cash.forEach(c => {
    const bal = parseFloat(c.balance) || 0;
    if (brokerCurrency(c.broker_id) === 'INR') inr += bal; else usd += bal;
  });
  return { usd, inr };
}

function totalRealizedPnl() {
  return state.orders
    .filter(o => o.status === 'Fulfilled' && o.order_type === 'SELL')
    .reduce((s, o) => s + (parseFloat(o.realized_pnl) || 0), 0);
}

function allocatedQty(brokerId, symbol, excludePBId) {
  return state.goalAllocs
    .filter(a => a.broker_id === brokerId && a.symbol === symbol && a.piggy_bank_id !== excludePBId)
    .reduce((s, a) => s + (parseFloat(a.quantity) || 0), 0);
}

// ─────────────────────────────────────────────────────────────────────────────
//  API CLIENT
// ─────────────────────────────────────────────────────────────────────────────
async function apiGet(action, extraParams = {}) {
  if (!gasUrlConfigured()) throw new Error('GAS URL not configured — click ⚙ to set it');
  const url = new URL(GAS_URL);
  url.searchParams.set('action', action);
  Object.entries(extraParams).forEach(([k,v]) => url.searchParams.set(k, v));
  const res = await fetch(url.toString(), { redirect: 'follow', mode: 'cors' });
  return res.json();
}

async function apiPost(data) {
  if (!gasUrlConfigured()) throw new Error('GAS URL not configured — click ⚙ to set it');
  // Send as GET with ?payload=JSON to avoid the POST→redirect CORS issue.
  // GAS 302-redirects POST /exec to a different origin; browsers block that
  // in cors mode. A plain GET is a simple request — no preflight, no redirect
  // issue — and doGet routes it via dispatchWrite() when payload is present.
  const url = new URL(GAS_URL);
  url.searchParams.set('payload', JSON.stringify(data));
  const res = await fetch(url.toString(), { redirect: 'follow' });
  return res.json();
}

async function loadAll(showToast = false) {
  const icon = document.getElementById('refresh-icon');
  icon.innerHTML = '<span class="spinner"></span>';
  document.getElementById('loading-overlay').classList.remove('hidden');
  hideAllPanels();
  try {
    const r = await apiGet('getAll');
    if (!r.success) throw new Error(r.error);
    Object.assign(state, r.data);
    if (showToast) toast('Portfolio refreshed');
  } catch (e) {
    toast('Load error: ' + e.message, 'error');
  } finally {
    icon.textContent = '↺';
    document.getElementById('loading-overlay').classList.add('hidden');
    renderCurrentTab();
  }
}

async function loadPrices() {
  try {
    const r = await apiGet('getPortfolioPrices');
    if (r.success) { state.prices = r.data; renderCurrentTab(); }
  } catch(e) { /* prices are optional */ }
}

// ─────────────────────────────────────────────────────────────────────────────
//  TAB MANAGEMENT
// ─────────────────────────────────────────────────────────────────────────────
function hideAllPanels() {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
}

function switchTab(tab) {
  state.currentTab = tab;
  hideAllPanels();
  document.querySelectorAll('nav button').forEach(b => { b.className = b.className.replace('tab-active','tab-inactive'); });
  document.getElementById('panel-' + tab).classList.remove('hidden');
  const btn = document.getElementById('tb-' + tab);
  if (btn) btn.className = btn.className.replace('tab-inactive','tab-active');
  renderCurrentTab();
}

function renderCurrentTab() {
  const renders = {
    dashboard:  renderDashboard,
    piggybanks: renderPiggyBanks,
    setup:      renderSetup,
    orders:     renderOrders,
    watchlist:  renderWatchlist,
  };
  const fn = renders[state.currentTab];
  if (fn) fn();
}

// ─────────────────────────────────────────────────────────────────────────────
//  DASHBOARD
// ─────────────────────────────────────────────────────────────────────────────
function renderDashboard() {
  const { usd, inr } = totalPortfolioValue();
  const pnl = totalRealizedPnl();
  const totalCashUSD = state.cash.filter(c => brokerCurrency(c.broker_id)==='USD').reduce((s,c)=>s+parseFloat(c.balance||0),0);
  const totalCashINR = state.cash.filter(c => brokerCurrency(c.broker_id)==='INR').reduce((s,c)=>s+parseFloat(c.balance||0),0);
  const investedUSD = usd - totalCashUSD;
  const investedINR = inr - totalCashINR;

  // Build per-broker table data
  const brokerRows = state.brokers.map(b => {
    const cash = getCash(b.id);
    const hlds = getHoldings(b.id);
    const inv  = hlds.reduce((s,h) => s + holdingValue(h), 0);
    const total = cash + inv;
    const acc   = getAccount(b.account_id);
    return { broker: b, account: acc, cash, invested: inv, total };
  });

  // Build holdings overview
  const holdingRows = state.holdings.map(h => {
    const b    = getBroker(h.broker_id);
    const acc  = b ? getAccount(b.account_id) : null;
    const qty  = parseFloat(h.quantity);
    const avg  = parseFloat(h.avg_cost);
    const curr = b ? b.currency : 'USD';
    const price = holdingPrice(h.symbol);
    const value = price != null ? price * qty : avg * qty;
    const unrlzd = price != null ? (price - avg) * qty : null;
    return { h, b, acc, qty, avg, curr, price, value, unrlzd };
  });

  document.getElementById('panel-dashboard').innerHTML = `
    <div class="space-y-6">
      <!-- Stat Cards -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div class="card">
          <p class="text-xs text-gray-500 font-medium uppercase tracking-wide">Total Portfolio (USD)</p>
          <p class="text-2xl font-bold text-gray-900 mt-1">${fmt(usd,'USD')}</p>
          ${inr > 0 ? `<p class="text-sm text-gray-500 mt-0.5">${fmt(inr,'INR')} INR</p>` : ''}
        </div>
        <div class="card">
          <p class="text-xs text-gray-500 font-medium uppercase tracking-wide">Total Cash</p>
          <p class="text-2xl font-bold text-gray-900 mt-1">${fmt(totalCashUSD,'USD')}</p>
          ${totalCashINR > 0 ? `<p class="text-sm text-gray-500 mt-0.5">${fmt(totalCashINR,'INR')}</p>` : ''}
        </div>
        <div class="card">
          <p class="text-xs text-gray-500 font-medium uppercase tracking-wide">Total Invested</p>
          <p class="text-2xl font-bold text-indigo-700 mt-1">${fmt(investedUSD,'USD')}</p>
          ${investedINR > 0 ? `<p class="text-sm text-gray-500 mt-0.5">${fmt(investedINR,'INR')}</p>` : ''}
        </div>
        <div class="card">
          <p class="text-xs text-gray-500 font-medium uppercase tracking-wide">Realized P&L</p>
          <p class="text-2xl font-bold mt-1 ${pnlClass(pnl)}">${pnl >= 0 ? '+' : ''}${fmt(pnl,'USD')}</p>
          <p class="text-xs text-gray-400 mt-0.5">Fulfilled sell orders</p>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Portfolio by Broker -->
        <div class="card lg:col-span-2">
          <h2 class="text-sm font-semibold text-gray-700 mb-3">Portfolio by Broker</h2>
          ${brokerRows.length === 0 ? '<p class="text-sm text-gray-400 text-center py-4">No brokers configured yet — go to Setup.</p>' : `
          <table class="w-full">
            <thead><tr><th>Account</th><th>Broker</th><th>Currency</th><th class="text-right">Cash</th><th class="text-right">Invested</th><th class="text-right">Total</th></tr></thead>
            <tbody>
              ${brokerRows.map(r => `
                <tr>
                  <td>${escHtml(r.account?.name || '—')}</td>
                  <td class="font-medium">${escHtml(r.broker.name)}</td>
                  <td><span class="text-xs font-semibold px-2 py-0.5 rounded-full ${r.broker.currency==='USD'?'bg-blue-100 text-blue-700':'bg-orange-100 text-orange-700'}">${r.broker.currency}</span></td>
                  <td class="text-right">${fmt(r.cash, r.broker.currency)}</td>
                  <td class="text-right">${fmt(r.invested, r.broker.currency)}</td>
                  <td class="text-right font-semibold">${fmt(r.total, r.broker.currency)}</td>
                </tr>`).join('')}
            </tbody>
          </table>`}
        </div>

        <!-- Chart -->
        <div class="card flex flex-col">
          <h2 class="text-sm font-semibold text-gray-700 mb-3">Allocation by Broker</h2>
          <div class="flex-1 flex items-center justify-center" style="min-height:180px;">
            <canvas id="broker-chart" style="max-height:200px;"></canvas>
          </div>
        </div>
      </div>

      <!-- Holdings Overview -->
      <div class="card">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-sm font-semibold text-gray-700">Holdings Overview</h2>
          <button onclick="loadPrices()" class="btn-gray text-xs">📡 Fetch Live Prices</button>
        </div>
        ${holdingRows.length === 0 ? '<p class="text-sm text-gray-400 text-center py-4">No holdings yet.</p>' : `
        <table class="w-full">
          <thead><tr><th>Symbol</th><th>Account / Broker</th><th class="text-right">Qty</th><th class="text-right">Avg Cost</th><th class="text-right">Live Price</th><th class="text-right">Market Value</th><th class="text-right">Unrealized P&L</th></tr></thead>
          <tbody>
            ${holdingRows.map(r => `
              <tr>
                <td class="font-semibold text-indigo-700">${escHtml(r.h.symbol)}</td>
                <td class="text-xs text-gray-500">${escHtml(r.acc?.name||'?')} / ${escHtml(r.b?.name||'?')}</td>
                <td class="text-right">${fmtN(r.qty, 4)}</td>
                <td class="text-right">${fmt(r.avg, r.curr)}</td>
                <td class="text-right">${r.price != null ? fmt(r.price, r.curr) : '<span class="text-gray-400 text-xs">—</span>'}</td>
                <td class="text-right font-medium">${fmt(r.value, r.curr)}</td>
                <td class="text-right ${r.unrlzd != null ? pnlClass(r.unrlzd) : 'text-gray-400'}">${r.unrlzd != null ? (r.unrlzd>=0?'+':'')+fmt(r.unrlzd, r.curr) : '—'}</td>
              </tr>`).join('')}
          </tbody>
        </table>`}
      </div>

      <!-- P&L by Stock -->
      ${buildPnlSection()}
    </div>`;

  // Render Chart.js broker allocation donut
  renderBrokerChart(brokerRows);
}

function buildPnlSection() {
  const sells = state.orders.filter(o => o.status === 'Fulfilled' && o.order_type === 'SELL');
  if (sells.length === 0) return '';
  const byStock = {};
  sells.forEach(o => {
    const sym = o.symbol;
    if (!byStock[sym]) byStock[sym] = 0;
    byStock[sym] += parseFloat(o.realized_pnl) || 0;
  });
  const entries = Object.entries(byStock).sort((a,b) => b[1]-a[1]);
  return `
    <div class="card">
      <h2 class="text-sm font-semibold text-gray-700 mb-3">Realized P&L by Stock</h2>
      <div style="max-height:240px"><canvas id="pnl-chart"></canvas></div>
    </div>`;
}

function renderBrokerChart(brokerRows) {
  const ctx = document.getElementById('broker-chart');
  if (!ctx) return;
  if (dashboardChart) { dashboardChart.destroy(); dashboardChart = null; }
  const labels = brokerRows.map(r => r.broker.name);
  const data   = brokerRows.map(r => Math.max(0, r.total));
  if (data.every(v => v === 0)) return;
  const COLORS = ['#4f46e5','#0ea5e9','#10b981','#f59e0b','#ef4444','#8b5cf6','#f97316','#06b6d4'];
  dashboardChart = new Chart(ctx, {
    type: 'doughnut',
    data: { labels, datasets: [{ data, backgroundColor: COLORS, borderWidth: 2, borderColor: '#fff' }] },
    options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { font: { size: 11 }, padding: 8 } } } }
  });

  // P&L chart
  const pnlCtx = document.getElementById('pnl-chart');
  if (!pnlCtx) return;
  if (pnlChart) { pnlChart.destroy(); pnlChart = null; }
  const sells = state.orders.filter(o => o.status==='Fulfilled' && o.order_type==='SELL');
  if (!sells.length) return;
  const byStock = {};
  sells.forEach(o => { byStock[o.symbol] = (byStock[o.symbol]||0) + (parseFloat(o.realized_pnl)||0); });
  const syms = Object.keys(byStock);
  const vals = syms.map(s => byStock[s]);
  pnlChart = new Chart(pnlCtx, {
    type: 'bar',
    data: { labels: syms, datasets: [{ label: 'Realized P&L ($)', data: vals,
      backgroundColor: vals.map(v => v >= 0 ? 'rgba(22,163,74,.7)' : 'rgba(220,38,38,.7)') }] },
    options: { responsive: true, plugins: { legend: { display: false } },
      scales: { y: { ticks: { callback: v => '$' + v.toFixed(0) } } } }
  });
}

function renderPiggyBanks() {

            <p class="text-xs text-gray-400 mt-1">${pct.toFixed(1)}% of goal</p>
          </div>` : `<p class="text-xs text-gray-400 mt-2">Est. value: ${fmt(currentVal, curr)}</p>`}
        ${allocTable}
      </div>`;
  }).join('');

  document.getElementById('panel-piggybanks').innerHTML = `

async function fetchWatchlistPrices() {
  _watchlistLoading = true;
  renderWatchlist();
  try {
    const r = await apiGet('getWatchlistPrices');
    if (r.success) { _watchlistPrices = r.data; toast('Prices updated'); }
    else toast(r.error || 'Failed to fetch prices', 'error');
  } catch(e) { toast('Price fetch error: ' + e.message, 'error'); }
  _watchlistLoading = false;
  renderWatchlist();
}

// ─────────────────────────────────────────────────────────────────────────────
function openAllocModal(pbId) {
  const pb = getPB(pbId);
  if (!pb) return;

  // Build list of all held symbols with availability
  const holdingOptions = state.holdings.map(h => {
    const b = getBroker(h.broker_id);
    const acc = b ? getAccount(b.account_id) : null;
    const totalAlloc = allocatedQty(h.broker_id, h.symbol, null);
    const available = parseFloat(h.quantity) - totalAlloc;
    const curAlloc = state.goalAllocs.find(a => a.piggy_bank_id===pbId && a.broker_id===h.broker_id && a.symbol===h.symbol);
    return { h, b, acc, available: available + (curAlloc ? parseFloat(curAlloc.quantity) : 0), curAlloc };
  });

  const hOpts = holdingOptions.map((item, i) => {
    const label = `${item.h.symbol} — ${item.acc?.name||'?'}/${item.b?.name||'?'} (have ${fmtN(item.h.quantity,4)}, avail ${fmtN(item.available,4)})`;
    return `<option value="${i}">${escHtml(label)}</option>`;
  });

  openModal(`
    <div class="p-5">
      ${modalHeader(`🐷 Allocate Stock to "${escHtml(pb.name)}"`)}
      <input type="hidden" id="m-alloc-pbid" value="${escHtml(pbId)}" />
      ${holdingOptions.length === 0 ? '<p class="text-sm text-gray-500 py-4 text-center">No holdings to allocate. Add holdings first.</p>' : `
        ${fieldRow('Select Holding', `<select id="m-alloc-hld" onchange="updateAllocAvail()">${hOpts.join('')}</select>`)}
        <p class="text-xs text-gray-500 mb-2" id="m-alloc-avail-label"></p>
        ${fieldRow('Quantity to Allocate', '<input id="m-alloc-qty" type="number" step="0.0001" min="0" placeholder="0"/>')}
        <p class="text-xs text-gray-400">Set to 0 to remove existing allocation.</p>
      `}
      ${holdingOptions.length > 0 ? modalFooter('Save Allocation', 'submitAlloc()') : modalFooter('Close', 'closeModal()')}
    </div>`);

  // Store holding options data for JS access
  window._allocHoldingOptions = holdingOptions;
  updateAllocAvail();
}

function updateAllocAvail() {
  const sel = document.getElementById('m-alloc-hld');
  const lbl = document.getElementById('m-alloc-avail-label');
  const qty = document.getElementById('m-alloc-qty');
  if (!sel || !lbl || !window._allocHoldingOptions) return;
  const item = window._allocHoldingOptions[parseInt(sel.value)];
  if (!item) return;
  lbl.textContent = `Available for this bank: ${fmtN(item.available, 4)} shares`;
  if (item.curAlloc) {
    qty.value = item.curAlloc.quantity;
    qty.placeholder = 'Current: ' + item.curAlloc.quantity;
  } else {
    qty.value = '';
  }
}

async function submitAlloc() {
  const pbId = document.getElementById('m-alloc-pbid').value;
  const idx  = parseInt(document.getElementById('m-alloc-hld').value);
  const qty  = parseFloat(document.getElementById('m-alloc-qty').value) || 0;
  const item = window._allocHoldingOptions[idx];
  if (!item) return;
  if (qty > item.available + 0.00001) { toast(`Cannot allocate more than available (${fmtN(item.available,4)})`, 'error'); return; }
  try {
    const r = await apiPost({
      action: 'setGoalAlloc',
      piggy_bank_id: pbId,
      broker_id: item.h.broker_id,
      symbol: item.h.symbol,
      quantity: qty,
    });
    if (!r.success) throw new Error(r.error);
    await loadAll();
    closeModal();
    toast('Allocation saved');
  } catch(e) { toast(e.message, 'error'); }
}

function previewOrderTotal() {
  const qty  = parseFloat(document.getElementById('m-ord-qty')?.value) || 0;

  const el   = document.getElementById('m-ord-calc');
  if (el) el.textContent = qty && prc ? `Net Total: $${Math.abs(net).toFixed(2)}` : '';
}

// ─────────────────────────────────────────────────────────────────────────────
//  FULFILL ORDER
// ─────────────────────────────────────────────────────────────────────────────
async function fulfillOrder(orderId) {
  const order = state.orders.find(o => o.id === orderId);
  if (!order) return;

  if (order.order_type === 'SELL') {
    // Check for piggy bank allocations
    const allocs = state.goalAllocs.filter(a => a.broker_id === order.broker_id && a.symbol === order.symbol);
    if (allocs.length > 0) {
      openFulfillSellModal(order, allocs);
      return;
    }
  }

  // BUY or SELL with no allocations — fulfill directly
  try {
    const r = await apiPost({ action: 'fulfillOrder', id: orderId, piggy_bank_deductions: [] });
    if (!r.success) throw new Error(r.error);
    await loadAll();
    toast('Order fulfilled');
  } catch(e) { toast(e.message, 'error'); }
}

function openFulfillSellModal(order, allocs) {
  const brk = getBroker(order.broker_id);
  const totalQty = parseFloat(order.quantity);

  const allocRows = allocs.map(a => {
    const pb = getPB(a.piggy_bank_id);
    return `
      <div class="flex items-center gap-3 mb-2">
        <span class="text-sm font-medium text-gray-700 flex-1">🐷 ${escHtml(pb?.name||a.piggy_bank_id)}</span>
        <span class="text-xs text-gray-400">Allocated: ${fmtN(a.quantity,4)}</span>
        <input id="ded-${escHtml(a.piggy_bank_id)}" type="number" step="0.0001" min="0"
          value="${Math.min(parseFloat(a.quantity), totalQty).toFixed(4)}"
          class="w-24 text-right" style="border:1px solid #d1d5db;border-radius:.375rem;padding:.25rem .5rem;font-size:.875rem;"
          onchange="updateDedTotal()"
        />
      </div>`;
  }).join('');

  openModal(`
    <div class="p-5">
      ${modalHeader(`✓ Fulfill SELL — ${escHtml(order.symbol)}`)}
      <p class="text-sm text-gray-600 mb-1">Selling <strong>${fmtN(order.quantity,4)} shares</strong> at ${fmt(order.price, brk?.currency||'USD')}.</p>
      <p class="text-sm text-gray-600 mb-4">This stock has piggy bank allocations. Specify how many shares to deduct from each bank:</p>
      ${allocRows}
      <p class="text-xs mt-2 mb-1">Sold: <strong>${fmtN(totalQty,4)}</strong> shares &nbsp;|&nbsp; Deducted: <strong id="ded-total">0</strong></p>
      <p class="text-xs text-gray-400">Shares not accounted for are removed from unallocated holding. You don't need to sum to exactly the sold quantity.</p>
      <input type="hidden" id="m-fulfill-ordid" value="${escHtml(order.id)}" />
      <input type="hidden" id="m-fulfill-allocs" value='${escHtml(JSON.stringify(allocs.map(a=>a.piggy_bank_id)))}' />
      ${modalFooter('Confirm Fulfill', 'submitFulfillSell()')}
    </div>`);

  updateDedTotal();
}

function updateDedTotal() {
  const allocIds = JSON.parse(document.getElementById('m-fulfill-allocs')?.value || '[]');
  let total = 0;
  allocIds.forEach(pbId => { total += parseFloat(document.getElementById('ded-'+pbId)?.value || 0); });
  const el = document.getElementById('ded-total');
  if (el) el.textContent = fmtN(total, 4);
}

async function submitFulfillSell() {
  const orderId  = document.getElementById('m-fulfill-ordid').value;
  const allocIds = JSON.parse(document.getElementById('m-fulfill-allocs').value || '[]');
  const deductions = allocIds.map(pbId => ({
    piggy_bank_id: pbId,
    quantity: parseFloat(document.getElementById('ded-'+pbId)?.value || 0)
  })).filter(d => d.quantity > 0);

  try {
    const r = await apiPost({ action: 'fulfillOrder', id: orderId, piggy_bank_deductions: deductions });
    if (!r.success) throw new Error(r.error);
    await loadAll();
    closeModal();
    toast('SELL order fulfilled');
  } catch(e) { toast(e.message, 'error'); }
}

  if (!confirm('Cancel this order?')) return;
  try {
    const r = await apiPost({ action: 'cancelOrder', id: orderId });
    if (!r.success) throw new Error(r.error);
    const o = state.orders.find(x => x.id === orderId);
    if (o) o.status = 'Cancelled';
    toast('Order cancelled');
    renderOrders();
  } catch(e) { toast(e.message, 'error'); }
}

async function deleteOrder(orderId) {
  if (!confirm('Permanently delete this order?')) return;
  try {
    const r = await apiPost({ action: 'deleteOrder', id: orderId });
    if (!r.success) throw new Error(r.error);
    state.orders = state.orders.filter(o => o.id !== orderId);
    toast('Order deleted');
    renderOrders();
  } catch(e) { toast(e.message, 'error'); }
}

async function deletePiggyBank(id) {
  if (!confirm('Delete this piggy bank and all its allocations?')) return;
  try {
    const r = await apiPost({ action: 'deletePiggyBank', id });
    if (!r.success) throw new Error(r.error);
    state.piggyBanks = state.piggyBanks.filter(p => p.id !== id);
    state.goalAllocs = state.goalAllocs.filter(a => a.piggy_bank_id !== id);
    toast('Piggy Bank deleted');
    renderCurrentTab();
  } catch(e) { toast(e.message, 'error'); }
}

// ─────────────────────────────────────────────────────────────────────────────
//  WATCHLIST ACTIONS
// ─────────────────────────────────────────────────────────────────────────────
async function addWatchlist() {
  const symbol = document.getElementById('wl-symbol').value.trim().toUpperCase();
  const notes  = document.getElementById('wl-notes').value.trim();
  if (!symbol) { toast('Symbol required', 'error'); return; }
  try {
    const r = await apiPost({ action: 'addWatchlist', symbol, notes });
    if (!r.success) throw new Error(r.error);
    state.watchlist.push(r.data);
    document.getElementById('wl-symbol').value = '';
    document.getElementById('wl-notes').value = '';
    toast(`${symbol} added to watchlist`);
    renderWatchlist();
  } catch(e) { toast(e.message, 'error'); }
}

async function removeWatchlist(id) {
  try {
    const r = await apiPost({ action: 'removeWatchlist', id });
    if (!r.success) throw new Error(r.error);
    state.watchlist = state.watchlist.filter(w => w.id !== id);
    toast('Removed from watchlist');
    renderWatchlist();
  } catch(e) { toast(e.message, 'error'); }
}

// ─────────────────────────────────────────────────────────────────────────────
//  INITIALIZATION
// ─────────────────────────────────────────────────────────────────────────────
function init() {
  updateGasStatusIndicator();
  if (!gasUrlConfigured()) {
    document.getElementById('config-banner').classList.remove('hidden');
    switchTab('dashboard');
    return;
  }
  switchTab('dashboard');
  loadAll().then(() => {
    if (state.holdings.length > 0) setTimeout(loadPrices, 1000);
  });
}

init();
</script>
